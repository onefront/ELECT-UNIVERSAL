<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELECT UNIVERSAL - Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: 0;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .brand-title {
            font-weight: 800;
            color: #0d6efd;
        }

        .login-btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card login-card">
    <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">

            <h2 class="brand-title">
                ELECT UNIVERSAL
            </h2>

            <p class="text-muted mb-0">
                Election Management Platform
            </p>

        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}

        <h4 class="fw-bold mb-4">
            Administrator Login
        </h4>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control form-control-lg"
                    placeholder="admin@example.com"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control form-control-lg"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100 login-btn"
            >
                Login
            </button>

        </form>

    </div>
</div>

</body>
</html>
