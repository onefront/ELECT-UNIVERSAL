<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voter Login - ELECT UNIVERSAL</title>

    <style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        padding: 20px;

        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eef5ff 0%,
                #ffffff 50%,
                #eef5ff 100%
            );

        display: flex;
        align-items: center;
        justify-content: center;
    }


    /* LOGIN CARD */

    .login-card {
        width: 100%;
        max-width: 430px;

        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow:
            0 15px 45px
            rgba(15, 23, 42, 0.12);

        border: 1px solid #edf1f7;
    }


    /* LOGO */

    .logo {
        text-align: center;

        color: #0d6efd;

        font-size: 29px;
        font-weight: 800;

        margin-bottom: 8px;

        letter-spacing: -0.5px;
    }


    .subtitle {
        text-align: center;

        color: #667085;

        margin-bottom: 30px;

        font-size: 15px;
    }


    /* FORM */

    label {
        display: block;

        font-weight: 600;

        color: #344054;

        margin-bottom: 8px;

        font-size: 14px;
    }


    input {
        width: 100%;

        padding: 14px 15px;

        border:
            1px solid #d8dee8;

        border-radius: 10px;

        font-size: 16px;

        margin-bottom: 20px;

        background: #fff;

        color: #1f2937;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }


    input::placeholder {
        color: #98a2b3;
    }


    input:focus {
        outline: none;

        border-color: #0d6efd;

        box-shadow:
            0 0 0 3px
            rgba(13, 110, 253, 0.12);
    }


    /* BUTTON */

    button {
        width: 100%;

        min-height: 50px;

        padding: 14px;

        border: none;

        border-radius: 10px;

        background:
            linear-gradient(
                135deg,
                #0d6efd,
                #084298
            );

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            opacity 0.2s ease;
    }


    button:hover {
        opacity: 0.95;

        transform: translateY(-1px);

        box-shadow:
            0 7px 18px
            rgba(13, 110, 253, 0.25);
    }


    button:active {
        transform: translateY(0);
    }


    /* ALERT */

    .alert {
        padding: 12px 14px;

        border-radius: 9px;

        margin-bottom: 20px;

        background: #fef3f2;

        color: #b42318;

        border: 1px solid #fecdca;

        font-size: 14px;

        line-height: 1.5;
    }


    /* INFORMATION */

    .info {
        margin-top: 25px;

        text-align: center;

        color: #777;

        font-size: 13px;

        line-height: 1.5;
    }


    /* MOBILE */

    @media (max-width: 576px) {

        body {
            padding: 15px;
        }


        .login-card {
            padding: 30px 22px;

            border-radius: 16px;
        }


        .logo {
            font-size: 25px;
        }


        .subtitle {
            margin-bottom: 25px;
        }


        input {
            padding: 14px;

            font-size: 16px;
        }


        button {
            min-height: 52px;

            font-size: 16px;
        }

    }


    /* SMALL PHONES */

    @media (max-width: 360px) {

        body {
            padding: 10px;
        }


        .login-card {
            padding: 25px 18px;
        }


        .logo {
            font-size: 23px;
        }

    }

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
    ✓ ELECT UNIVERSAL
</div>

    <div class="subtitle">
        Secure Voter Login
    </div>


    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <label for="voter_identifier">
            Voter ID
        </label>

        <input
            type="text"
            id="voter_identifier"
            name="voter_identifier"
            placeholder="e.g. UV-000001"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            LOGIN TO VOTE
        </button>

    </form>


    <div class="info">
        Use the Voter ID and password provided to you.
    </div>

</div>

</body>

</html>
