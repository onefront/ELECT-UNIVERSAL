<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vote Submitted - ELECT UNIVERSAL</title>
<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        background: #f4f7fb;
        color: #172033;
    }


    /* =========================
       TOP BAR
    ========================= */

    .topbar {
        background:
            linear-gradient(
                135deg,
                #0d6efd,
                #084298
            );

        color: white;

        padding: 16px 30px;

        font-size: 20px;

        font-weight: 700;

        min-height: 70px;

        display: flex;
        align-items: center;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
        width: 100%;

        max-width: 650px;

        margin:
            70px auto;

        padding:
            0 20px;
    }


    /* =========================
       SUCCESS CARD
    ========================= */

    .card {
        background: white;

        padding:
            45px 30px;

        border-radius: 18px;

        text-align: center;

        box-shadow:
            0 8px 25px
            rgba(0, 0, 0, 0.08);
    }


    .success-icon {
        font-size: 65px;

        margin-bottom: 15px;
    }


    h1 {
        color: #0d6efd;

        font-size: 30px;

        line-height: 1.3;

        margin:
            0 0 15px;
    }


    .card p {
        color: #667085;

        line-height: 1.6;
    }


    /* =========================
       BALLOT REFERENCE
    ========================= */

    .ballot-id {
        background: #f1f5f9;

        padding: 14px;

        border-radius: 8px;

        margin: 20px 0;

        font-weight: 700;

        word-break: break-all;

        overflow-wrap: anywhere;

        line-height: 1.6;
    }


    /* =========================
       BUTTON
    ========================= */

    .button {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        min-height: 50px;

        background:
            linear-gradient(
                135deg,
                #0d6efd,
                #084298
            );

        color: white;

        text-decoration: none;

        padding:
            13px 25px;

        border-radius: 8px;

        font-weight: 700;

        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }


    .button:hover {
        background: #0958c7;

        color: white;

        transform:
            translateY(-1px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 767px) {

        .topbar {
            padding:
                14px 16px;

            min-height: 62px;

            font-size: 17px;
        }


        .container {
            margin:
                35px auto;

            padding:
                0 15px;
        }


        .card {
            padding:
                35px 20px;

            border-radius: 15px;
        }


        .success-icon {
            font-size: 55px;

            margin-bottom: 10px;
        }


        h1 {
            font-size: 24px;
        }


        .card p {
            font-size: 14px;
        }


        .button {
            width: 100%;

            min-height: 52px;
        }

    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

        .topbar {
            padding:
                12px;

            font-size: 15px;
        }


        .container {
            margin:
                25px auto;

            padding:
                0 12px;
        }


        .card {
            padding:
                30px 17px;
        }


        .success-icon {
            font-size: 48px;
        }


        h1 {
            font-size: 21px;
        }


        .ballot-id {
            font-size: 13px;

            padding: 12px;
        }

    }

</style>
</head>

<body>

<div class="topbar">
    ✓ ELECT UNIVERSAL
</div>

<div class="container">

    <div class="card">

        <div class="success-icon">
            ✅
        </div>

        <h1>
            Vote Submitted Successfully
        </h1>

        <p>
            Thank you, {{ voter.voter_identifier }}.
        </p>

        <p>
            Your vote has been successfully recorded.
        </p>

        <div class="ballot-id">

            Ballot Reference:<br>

            {{ ballot.ballot_uuid }}

        </div>

        <p>
            You cannot vote again in this election.
        </p>

        <a
            href="{{ url_for('voter_auth.dashboard') }}"
            class="button"
        >
            Return to Dashboard
        </a>

    </div>

</div>

</body>

</html>
